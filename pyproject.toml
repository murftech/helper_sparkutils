[project]
name = "sparkutils"
version = "0.1.0"
description = "getspark, getsail, getdatabricksspark, import pyspark functions"
requires-python = ">=3.12"
dependencies = [
    "pyspark[connect]>=4.0.1",
    "pysail>=0.7.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sparkutils"]