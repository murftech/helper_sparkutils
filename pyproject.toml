[project]
name = "sparkutils"
version = "0.1.0"
description = "getspark, getsail, getdatabricksspark, import pyspark functions"
requires-python = ">=3.12"
dependencies = []
# just the functions - pyspark/pysail come from whatever project installs this
# (pipe_hdb_sparkbricks already declares both directly), not from here.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sparkutils"]